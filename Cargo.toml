[package]
name = "n2f-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "The Rust backend blueprint in the nine to five family"
publish = false

[dependencies]
base64 = "=0.22.1"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres"] }
sha2 = "=0.10.9"
serde = { version = "=1.0.228", features = ["derive"] }
tungstenite = { version = "=0.28.0", default-features = false }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-webpki-roots", "stream"] }
getrandom = "0.4.1"
serde_json = "=1.0.149"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
axum = { version = "=0.8.6", features = ["ws"] }
tokio = { version = "=1.47.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
opentelemetry = "=0.31.0"
opentelemetry_sdk = { version = "=0.31.0", features = ["trace", "metrics", "logs"] }
opentelemetry-otlp = { version = "=0.31.0", default-features = false, features = ["trace", "metrics", "logs", "http-proto", "reqwest-blocking-client", "reqwest-rustls-webpki-roots"] }
http-body = "=1.0.1"
futures-util = "=0.3.34"
bytes = "=1.10.1"
url = "=2.5.8"
hyper = { version = "=1.11.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio", "service"] }
async-nats = "=0.39.0"
